<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SenaLinks</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#171717;font:16px Arial,sans-serif}header{background:#fff;border-bottom:2px solid #111;padding:22px 7%;font-size:26px;font-weight:900}main{max-width:960px;margin:45px auto;padding:0 20px}.panel{background:#fff;border:2px solid #111;border-radius:8px;padding:26px;margin:22px 0;box-shadow:5px 5px #111}h1{font-size:40px;margin:0 0 10px}p{color:#666}input{display:block;width:100%;margin:12px 0;padding:15px;border:2px solid #ddd;border-radius:6px;font-size:16px}button{border:2px solid #111;border-radius:6px;background:#111;color:white;padding:13px 19px;font-weight:800;cursor:pointer;margin:5px 5px 5px 0}.secondary{background:white;color:#111}[hidden]{display:none!important}.item{padding:18px 0;border-top:1px solid #ddd;overflow-wrap:anywhere}.item a{color:#1951ad;font-weight:bold}.small{font-size:13px;color:#666}#status{white-space:pre-wrap}footer{text-align:center;color:#777;padding:30px}</style></head>
<body><header>SENA<span style="color:#888">LINKS</span></header><main id="main"><section class="panel"><h1>Твоя ссылка. Твои правила.</h1><p>Создавай короткие ссылки, редактируй названия и отслеживай переходы.</p></section>
<section class="panel" id="auth"><h2>Вход и регистрация</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль (от 6 символов)"><button id="login">Войти</button><button id="signup" class="secondary">Регистрация</button></section>
<div id="dashboard" hidden><section class="panel"><h2>Новая ссылка</h2><input id="destination" type="url" placeholder="https://example.com"><input id="slug" placeholder="Короткое имя, например masic"><input id="title" placeholder="Название (необязательно)"><button id="create">Создать</button><button id="logout" class="secondary">Выйти</button></section><section class="panel"><h2>Мои ссылки</h2><div id="links"></div></section></div><p id="status" role="status"></p></main><footer>Made by MASIC</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://yzgcnpjqovhwusuyheve.supabase.co','sb_publishable_E9kuga58i0rkx0iSkOS9IQ_ZgKkIQoS');
const el=id=>document.getElementById(id),say=t=>el('status').textContent=t,base=location.origin+location.pathname;let current=null;
const valid=s=>/^[a-z0-9][a-z0-9_-]{2,39}$/.test(s);
function parseUrl(s){const u=new URL(s);if(!['http:','https:'].includes(u.protocol))throw Error('Нужен http или https');return u.href}
async function resolve(){const slug=new URLSearchParams(location.search).get('s');if(!slug)return false;el('main').textContent='Перенаправление...';try{const r=await db.rpc('resolve_link',{p_slug:slug});if(r.error||!r.data)throw Error('Ссылка не найдена');const target=parseUrl(r.data);try{await db.rpc('record_click',{p_slug:slug})}catch(clickError){console.warn('Click counter unavailable',clickError)}location.replace(target)}catch(e){el('main').textContent='Ошибка: '+e.message}return true}
async function sync(){const r=await db.auth.getUser();current=r.data.user;el('auth').hidden=!!current;el('dashboard').hidden=!current;if(current)await list()}
async function list(){const r=await db.from('links').select('id,slug,title,destination,clicks').order('created_at',{ascending:false});if(r.error){say(r.error.message);return}const root=el('links');root.replaceChildren();if(!r.data.length){root.textContent='Ссылок пока нет';return}for(const l of r.data){const box=document.createElement('div');box.className='item';const a=document.createElement('a');a.href=base+'?s='+encodeURIComponent(l.slug);a.target='_blank';a.rel='noopener';a.textContent=a.href;box.append(a);const meta=document.createElement('p');meta.className='small';meta.textContent=(l.title||'Без названия')+' · '+l.clicks+' переходов · '+l.destination;box.append(meta);function button(label,fn){const b=document.createElement('button');b.className='secondary';b.textContent=label;b.onclick=fn;box.append(b)}
button('Копировать',()=>navigator.clipboard.writeText(a.href).then(()=>say('Ссылка скопирована')).catch(e=>say(e.message)));
button('Изменить',async()=>{const slug=prompt('Новое короткое имя:',l.slug);if(slug===null)return;const title=prompt('Название:',l.title);if(title===null)return;const destination=prompt('Оригинальная ссылка:',l.destination);if(destination===null)return;try{if(!valid(slug))throw Error('Некорректное короткое имя');const r=await db.from('links').update({slug,title,destination:parseUrl(destination)}).eq('id',l.id);if(r.error)throw r.error;await list()}catch(e){say(e.message)}});
button('Удалить',async()=>{if(!confirm('Удалить ссылку?'))return;const r=await db.from('links').delete().eq('id',l.id);if(r.error)say(r.error.message);else await list()});root.append(box)}}
el('signup').onclick=async()=>{const r=await db.auth.signUp({email:el('email').value,password:el('password').value});say(r.error?r.error.message:'Проверь почту для подтверждения регистрации.');await sync()};
el('login').onclick=async()=>{const r=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});say(r.error?r.error.message:'Вход выполнен');await sync()};
el('logout').onclick=async()=>{await db.auth.signOut();await sync()};
el('create').onclick=async()=>{try{const slug=el('slug').value.trim().toLowerCase();if(!valid(slug))throw Error('Короткое имя: 3–40 символов, латиница, цифры, _ или -');const r=await db.from('links').insert({owner_id:current.id,slug,title:el('title').value.trim(),destination:parseUrl(el('destination').value)});if(r.error)throw r.error;el('slug').value='';el('destination').value='';el('title').value='';say('Ссылка создана');await list()}catch(e){say(e.message)}};
if(!new URLSearchParams(location.search).has('s')){sync();db.auth.onAuthStateChange(()=>setTimeout(sync,0))}else resolve();
</script></body></html>
